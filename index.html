<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Student FAQ Chatbot</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1f3c88;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        #chatbox {
            height: 350px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
        }

        .user {
            background: #dbeafe;
            text-align: right;
        }

        .bot {
            background: #e8f5e9;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #1f3c88;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #162d68;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>College Student FAQ Chatbot</h1>

    <p class="subtitle">
        Ask questions about college facilities, rules and student services.
    </p>

    <div id="chatbox">
        <div class="message bot">
            <strong>Bot:</strong> Hello! How can I help you?
        </div>
    </div>

    <div class="input-area">
        <input
            type="text"
            id="question"
            placeholder="Type your question..."
        >

        <button onclick="askQuestion()">Ask</button>
    </div>

</div>

<script>
async function askQuestion() {

    const input = document.getElementById("question");
    const question = input.value.trim();

    if (question === "") {
        return;
    }

    const chatbox = document.getElementById("chatbox");

    chatbox.innerHTML += `
        <div class="message user">
            <strong>You:</strong> ${question}
        </div>
    `;

    input.value = "";

    const response = await fetch("/ask", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            question: question
        })
    });

    const data = await response.json();

    chatbox.innerHTML += `
        <div class="message bot">
            <strong>Bot:</strong> ${data.answer}
        </div>
    `;

    chatbox.scrollTop = chatbox.scrollHeight;
}
</script>

</body>
</html>
